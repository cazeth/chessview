name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the in-progress run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build and run the test suite on the systems a terminal app is expected to
  # run on. `--locked` makes CI use the committed Cargo.lock so runs are
  # reproducible; the image tests use the half-block backend and need no real
  # terminal, so `--all-features` works headless.
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (default features)
        run: cargo test --locked
      - name: Test (all features)
        run: cargo test --locked --all-features

  # Enforce the lint policy declared in src/lib.rs. Clippy runs the rustc lints
  # too (rust_2018_idioms, dead_code, unused, ...) and only lints this crate,
  # not its dependencies, so `-D warnings` turns every warn-level lint from
  # lib.rs into a hard failure without tripping on dependency warnings. The
  # deny-level lints there (unsafe_code, unwrap_used outside tests) already fail
  # the build on their own.
  clippy:
    name: clippy + rustc lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Verify the crate still builds on its declared minimum supported Rust
  # version. Default features only: the optional `images` feature needs 1.86.
  # Cargo.toml sets resolver = "3" (MSRV-aware), so `cargo update` keeps the
  # lockfile on versions compatible with rust-version and this stays green
  # without hand-pinning. If it ever fails, a required dependency has stopped
  # publishing any 1.85-compatible version; the fix is to raise rust-version.
  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
